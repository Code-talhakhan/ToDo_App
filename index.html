<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="animated-gradient">

    <div class="todo-container">
        <div class="shimmer"></div>

        <h1 class="title">🌴 <span class="emoji-animate">📝</span> My Todo List</h1>

        <form onsubmit="todo_app(event)">
            <div class="input-box">
                <input type="text" class="userInput" placeholder="Write your task..." required>
                <button type="submit">Add</button>
            </div>
        </form>

        <div class="result"></div>
    </div>

    <script src="./main.mjs"></script>
</body>
</html>
